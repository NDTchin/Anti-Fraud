name: vsf-graph-fraud

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:2026.06.0}
    container_name: vsf-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 6G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-change-me} "RETURN 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
