name: vsf-graph-fraud

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:2026.06.0}
    container_name: vsf-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 6G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - "${NEO4J_IMPORT_DIR:-../data/neo4j-import}:/import:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-change-me} "RETURN 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  neo4j-import:
    image: ${NEO4J_IMAGE:-neo4j:2026.06.0}
    profiles: ["tools"]
    entrypoint: ["neo4j-admin", "database", "import", "full"]
    command:
      - neo4j
      - --input-type=parquet
      - --overwrite-destination=true
      - --max-off-heap-memory=6G
      - --nodes=Order=/import/headers/orders.csv,/source/orders_ride_masked_2026-07-14.parquet
      - --nodes=Customer=/import/headers/customers.csv,/import/nodes/customers.parquet
      - --nodes=Driver=/import/headers/drivers.csv,/import/nodes/drivers.parquet
      - --nodes=Address=/import/headers/addresses.csv,/import/nodes/addresses.parquet
      - --nodes=PaymentMethod=/import/headers/payment_methods.csv,/import/nodes/payment_methods.parquet
      - --nodes=PromotionCode=/import/headers/promotion_codes.csv,/import/nodes/promotion_codes.parquet
      - --nodes=PromotionCampaign=/import/headers/promotion_campaigns.csv,/import/nodes/promotion_campaigns.parquet
      - --relationships=PLACED=/import/headers/placed.csv,/import/relationships/placed.parquet
      - --relationships=SERVED=/import/headers/served.csv,/import/relationships/served.parquet
      - --relationships=PICKUP_AT=/import/headers/pickup_at.csv,/import/relationships/pickup_at.parquet
      - --relationships=DROPOFF_AT=/import/headers/dropoff_at.csv,/import/relationships/dropoff_at.parquet
      - --relationships=PAID_BY=/import/headers/paid_by.csv,/import/relationships/paid_by.parquet
      - --relationships=USED_PROMO=/import/headers/used_promo.csv,/import/relationships/used_promo.parquet
      - --relationships=IN_CAMPAIGN=/import/headers/in_campaign.csv,/import/relationships/in_campaign.parquet
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - "${NEO4J_IMPORT_DIR:-../data/neo4j-import}:/import:ro"
      - "../data:/source:ro"

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:

